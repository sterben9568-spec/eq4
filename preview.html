<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RBT EQ — revised layout</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b0c;color:#d5d9db;font:12px Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:20px}.unit{width:min(1220px,98vw);background:linear-gradient(#262a2c,#191c1e 15%,#171a1c);border:1px solid #34393c;border-radius:8px;padding:16px;box-shadow:0 24px 80px #000a,inset 0 1px #5554}.head{height:44px;display:flex;align-items:center;border-bottom:1px solid #080a0b;margin-bottom:12px;padding:0 5px 10px}.brand{font-weight:900;font-size:21px;letter-spacing:1.3px;color:#e5e7e8;text-shadow:0 1px #000}.brand span{color:#b8bec1}.sub{margin-left:16px;font-size:9px;letter-spacing:2px;color:#7e878b}.badge{margin-left:auto;font-size:9px;color:#929a9e;letter-spacing:1.3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:12px}.left{display:grid;grid-template-columns:repeat(8,minmax(86px,1fr));gap:5px}.strip{position:relative;background:linear-gradient(180deg,#292d30,#1d2022 30%,#181b1d);border:1px solid #363b3e;border-radius:4px;padding:7px 5px 8px;min-width:0;box-shadow:inset 0 1px 2px #ffffff09}.strip:after{content:'';position:absolute;inset:0;border-radius:4px;pointer-events:none;box-shadow:inset 0 0 0 1px #0005}.tag{display:flex;align-items:center;gap:5px;font-size:9px;color:#b4bbbe;letter-spacing:.7px;font-weight:bold;margin-bottom:8px}.lamp{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 5px var(--c)}.knobbox{text-align:center;margin:4px 0 7px}.knob{width:48px;height:48px;margin:auto;position:relative;border-radius:50%;background:radial-gradient(circle at 35% 28%,#52585c,#34393c 45%,#202426 75%);border:1px solid #5a6064;box-shadow:inset 0 2px 4px #000a,0 1px #ffffff14;cursor:ns-resize}.knob:before{content:'';position:absolute;width:2px;height:11px;top:5px;left:23px;background:#e1e5e6;border-radius:2px;transform:rotate(var(--rot,0deg));transform-origin:1px 19px}.knob:after{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid #ffffff08}.read{color:#dce0e1;font-size:10px;margin-top:3px;white-space:nowrap}.caption{font-size:8px;letter-spacing:1px;color:#81898d;margin-top:1px}.type{width:100%;margin:5px 0 4px;background:#292d30;border:1px solid #4b5155;border-radius:2px;color:#c8ced0;font-size:9px;padding:4px 2px}.buttons{display:flex;gap:4px}.button{flex:1;background:linear-gradient(#34393c,#222629);border:1px solid #4b5154;color:#aeb5b8;border-radius:2px;padding:4px 2px;font-size:8px;letter-spacing:.5px;cursor:pointer}.button.active{color:#fff;border-color:#9ca4a8;box-shadow:inset 0 0 5px #ffffff14}.button.solo.active{color:var(--c);border-color:var(--c);box-shadow:0 0 5px color-mix(in srgb,var(--c) 35%,transparent)}.analyzer{background:linear-gradient(#212527,#171a1c);border:1px solid #373d40;border-radius:4px;padding:9px 8px 6px;display:flex;flex-direction:column}.an-title{font-size:9px;letter-spacing:1.5px;color:#aeb5b8;margin:0 2px 5px;display:flex;justify-content:space-between}.an-title small{color:#727b7f;font-size:8px}.graph{width:100%;height:275px;display:block;background:#121517;border:1px solid #2c3235}.legend{display:flex;gap:8px;margin-top:7px;font-size:8px;color:#858e92;align-items:center}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}.foot{border-top:1px solid #090b0c;margin-top:12px;padding-top:8px;color:#717a7e;font-size:9px;letter-spacing:.6px;display:flex;justify-content:space-between}.active-note{color:#c4cacc}@media(max-width:900px){.layout{grid-template-columns:1fr}.left{grid-template-columns:repeat(4,minmax(85px,1fr))}.graph{height:210px}}@media(max-width:520px){.left{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="unit"><header class="head"><div class="brand">RBT <span>/ EQ</span></div><div class="sub">8 BAND STEREO EQUALIZER</div><div class="badge">DESIGN REVISION · 0.2</div></header><div class="layout"><section class="left" id="bands"></section><aside class="analyzer"><div class="an-title"><span>SPECTRUM / RESPONSE</span><small>20 Hz — 20 kHz</small></div><canvas id="graph" class="graph" width="500" height="340"></canvas><div class="legend"><span><i class="dot" style="background:#6d9aa5"></i>INPUT</span><span><i class="dot" style="background:#e4e6e7"></i>EQ CURVE</span><span id="soloLabel" class="active-note"></span></div></aside></div><div class="foot"><span>STEREO · NO M/S · 8 PARAMETRIC BANDS</span><span>CLICK / DRAG BAND NODES TO EDIT</span></div></div>
<script>
const cols=['#d6a14e','#d68a54','#cb6b64','#b37aca','#887fda','#5999cd','#5ab5a2','#94b961'];const d=[{f:50,g:0,q:1,t:'Bell'},{f:120,g:0,q:1,t:'Bell'},{f:350,g:0,q:1,t:'Bell'},{f:900,g:0,q:1,t:'Bell'},{f:2200,g:0,q:1,t:'Bell'},{f:4800,g:0,q:1,t:'Bell'},{f:9000,g:0,q:1,t:'Bell'},{f:15000,g:0,q:1,t:'Bell'}];const types=['Bell','Low Shelf','High Shelf','HPF','LPF'];let solo=-1,selected=0;const host=document.getElementById('bands');d.forEach((b,i)=>{let s=document.createElement('div');s.className='strip';s.style.setProperty('--c',cols[i]);s.innerHTML=`<div class="tag"><i class="lamp"></i>BAND ${String(i+1).padStart(2,'0')}</div>${['f','g','q'].map(k=>`<div class="knobbox"><div class="knob" data-i="${i}" data-k="${k}" title="Drag vertically"></div><div class="read" id="${k}${i}">${k==='f'?Math.round(b.f)+' Hz':k==='g'?b.g.toFixed(1)+' dB':b.q.toFixed(2)}</div><div class="caption">${k==='f'?'FREQUENCY':k==='g'?'GAIN':'Q'}</div></div>`).join('')}<select class="type" id="type${i}" aria-label="Band ${i+1} filter type">${types.map(t=>`<option ${b.t===t?'selected':''}>${t}</option>`).join('')}</select><div class="buttons"><button class="button active" id="on${i}">IN</button><button class="button" id="solo${i}">SOLO</button></div>`;host.appendChild(s)});
const cv=document.getElementById('graph'),ctx=cv.getContext('2d');const pad={l:37,r:10,t:14,b:26};function X(f){return pad.l+Math.log10(Math.max(20,Math.min(20000,f))/20)/3*(cv.width-pad.l-pad.r)}function Y(db){return pad.t+(18-db)/36*(cv.height-pad.t-pad.b)}function response(f,b){let ratio=f/b.f;if(b.t==='Bell')return b.g*Math.exp(-.5*(Math.log2(ratio)/(1/b.q))**2);if(b.t==='Low Shelf')return b.g/(1+Math.pow(ratio,2));if(b.t==='High Shelf')return b.g/(1+Math.pow(1/ratio,2));if(b.t==='HPF')return f<b.f?-18*Math.log2(b.f/f):0;if(b.t==='LPF')return f>b.f?-18*Math.log2(f/b.f):0;return 0}function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#121517';ctx.fillRect(0,0,cv.width,cv.height);[20,30,50,100,200,500,1000,2000,5000,10000,20000].forEach(f=>{let x=X(f);ctx.strokeStyle='#2b3134';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,cv.height-pad.b);ctx.stroke();ctx.fillStyle='#747d81';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(f>=1000?(f/1000)+'k':f,x,cv.height-8)});for(let db=-18;db<=18;db+=6){let y=Y(db);ctx.strokeStyle='#2b3134';ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(cv.width-pad.r,y);ctx.stroke();ctx.fillStyle='#7b8488';ctx.font='10px Arial';ctx.textAlign='right';ctx.fillText((db>0?'+':'')+db,pad.l-6,y+3)}ctx.beginPath();ctx.moveTo(pad.l,Y(0));ctx.lineTo(cv.width-pad.r,Y(0));ctx.strokeStyle='#747d82';ctx.stroke();let spec=ctx.createLinearGradient(0,pad.t,0,cv.height-pad.b);spec.addColorStop(0,'#5d8c9c44');spec.addColorStop(1,'#5d8c9c00');ctx.beginPath();for(let x=pad.l;x<cv.width-pad.r;x++){let f=20*Math.pow(1000,(x-pad.l)/(cv.width-pad.l-pad.r));let mag=-58+17*Math.sin(Math.log(f)*2.1)+10*Math.sin(Math.log(f)*5.2)+5*Math.sin(f/1000);let y=Y(Math.max(-18,Math.min(18,(mag+58)*.32-6)));x===pad.l?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.lineTo(cv.width-pad.r,cv.height-pad.b);ctx.lineTo(pad.l,cv.height-pad.b);ctx.closePath();ctx.fillStyle=spec;ctx.fill();ctx.beginPath();for(let x=pad.l;x<cv.width-pad.r;x++){let f=20*Math.pow(1000,(x-pad.l)/(cv.width-pad.l-pad.r));let mag=-58+17*Math.sin(Math.log(f)*2.1)+10*Math.sin(Math.log(f)*5.2)+5*Math.sin(f/1000);let y=Y(Math.max(-18,Math.min(18,(mag+58)*.32-6)));x===pad.l?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='#76a7b2';ctx.lineWidth=1.3;ctx.stroke();ctx.beginPath();for(let x=pad.l;x<cv.width-pad.r;x++){let f=20*Math.pow(1000,(x-pad.l)/(cv.width-pad.l-pad.r)),gain=0;d.forEach((b,i)=>{if(document.getElementById('on'+i).classList.contains('active'))gain+=response(f,b)});let y=Y(Math.max(-18,Math.min(18,gain)));x===pad.l?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='#e5e7e8';ctx.lineWidth=2;ctx.stroke();d.forEach((b,i)=>{let x=X(b.f),y=Y(b.g);ctx.beginPath();ctx.arc(x,y,i===selected?5.5:4.2,0,Math.PI*2);ctx.fillStyle=cols[i];ctx.fill();ctx.strokeStyle='#111416';ctx.stroke();if(i===solo||i===selected){ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.strokeStyle=cols[i]+'77';ctx.stroke()}});document.getElementById('soloLabel').textContent=solo>=0?'BAND '+(solo+1)+' SOLO ACTIVE':''}
function update(i,k){document.getElementById(k+i).textContent=k==='f'?Math.round(d[i].f)+' Hz':k==='g'?d[i].g.toFixed(1)+' dB':d[i].q.toFixed(2);draw()}document.querySelectorAll('.knob').forEach(el=>{let dragging=false,sy,sv;el.addEventListener('pointerdown',e=>{dragging=true;el.setPointerCapture(e.pointerId);sy=e.clientY;let i=+el.dataset.i,k=el.dataset.k;sv=d[i][k];selected=i;e.preventDefault()});el.addEventListener('pointermove',e=>{if(!dragging)return;let i=+el.dataset.i,k=el.dataset.k,delta=(sy-e.clientY)*.01;if(k==='f')d[i].f=Math.max(20,Math.min(20000,sv*Math.pow(10,delta*2.3)));if(k==='g')d[i].g=Math.max(-18,Math.min(18,sv+delta*36));if(k==='q')d[i].q=Math.max(.1,Math.min(10,sv+delta*6));update(i,k)});el.addEventListener('pointerup',()=>dragging=false)});d.forEach((b,i)=>{document.getElementById('type'+i).onchange=e=>{b.t=e.target.value;selected=i;draw()};document.getElementById('on'+i).onclick=e=>{e.currentTarget.classList.toggle('active');draw()};document.getElementById('solo'+i).onclick=e=>{solo=solo===i?-1:i;d.forEach((_,j)=>document.getElementById('solo'+j).classList.toggle('active',j===solo));selected=i;draw()}});let draggingGraph=false;cv.addEventListener('pointerdown',e=>{let rect=cv.getBoundingClientRect(),px=(e.clientX-rect.left)*cv.width/rect.width,py=(e.clientY-rect.top)*cv.height/rect.height;let closest=-1,dist=16;d.forEach((b,i)=>{let dd=Math.hypot(px-X(b.f),py-Y(b.g));if(dd<dist){dist=dd;closest=i}});if(closest>=0){selected=closest;draggingGraph=true;cv.setPointerCapture(e.pointerId);moveGraph(e)}});function moveGraph(e){if(!draggingGraph)return;let r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*cv.width/r.width,py=(e.clientY-r.top)*cv.height/r.height;let b=d[selected];b.f=20*Math.pow(1000,Math.max(0,Math.min(1,(px-pad.l)/(cv.width-pad.l-pad.r))));b.g=Math.max(-18,Math.min(18,(18-(py-pad.t)/(cv.height-pad.t-pad.b)*36)));document.getElementById('f'+selected).textContent=Math.round(b.f)+' Hz';document.getElementById('g'+selected).textContent=b.g.toFixed(1)+' dB';draw()}cv.addEventListener('pointermove',moveGraph);cv.addEventListener('pointerup',()=>draggingGraph=false);draw();
</script></body></html>
